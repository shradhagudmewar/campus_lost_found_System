<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🎓 Campus Lost & Found</h1>
        <p>Report lost items and help others find their belongings</p>
    </header>


    <main>

        <!-- Form Section -->
        <section class="form-section">

            <h2>Report an Item</h2>

            <form id="itemForm">

                <!-- Item Name -->
                <div class="form-group">
                    <label for="itemName">Item Name</label>

                    <input
                        type="text"
                        id="itemName"
                        placeholder="Example: Black Wallet"
                    >

                    <small id="itemNameError" class="error"></small>
                </div>


                <!-- Description -->
                <div class="form-group">

                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        placeholder="Describe the item..."
                    ></textarea>

                    <small id="descriptionError" class="error"></small>

                </div>


                <!-- Location -->
                <div class="form-group">

                    <label for="location">Location</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Example: Library"
                    >

                    <small id="locationError" class="error"></small>

                </div>


                <!-- Date -->
                <div class="form-group">

                    <label for="date">Date</label>

                    <input type="date" id="date">

                    <small id="dateError" class="error"></small>

                </div>


                <!-- Contact -->
                <div class="form-group">

                    <label for="contact">Contact Number</label>

                    <input
                        type="text"
                        id="contact"
                        placeholder="10 digit mobile number"
                    >

                    <small id="contactError" class="error"></small>

                </div>


                <!-- Type -->
                <div class="form-group">

                    <label>Item Type</label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="itemType"
                                value="Lost"
                            >
                            Lost
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="itemType"
                                value="Found"
                            >
                            Found
                        </label>

                    </div>

                    <small id="typeError" class="error"></small>

                </div>


                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    ➕ Add Item
                </button>

                <p id="successMessage" class="success"></p>

            </form>

        </section>



        <!-- Search Section -->
        <section class="search-section">

            <h2>Search Items</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by item name or location..."
            >

            <select id="filterType">

                <option value="All">All Items</option>

                <option value="Lost">Lost Items</option>

                <option value="Found">Found Items</option>

            </select>

        </section>



        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">

                <h3 id="totalItems">0</h3>

                <p>Total Items</p>

            </div>


            <div class="stat-card">

                <h3 id="lostItems">0</h3>

                <p>Lost Items</p>

            </div>


            <div class="stat-card">

                <h3 id="foundItems">0</h3>

                <p>Found Items</p>

            </div>

        </section>



        <!-- Items Section -->
        <section class="items-section">

            <h2>Reported Items</h2>

            <div id="itemsContainer">

                <!-- JavaScript will display items here -->

            </div>

        </section>

    </main>


    <footer>

        <p>© 2026 Campus Lost & Found System</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
